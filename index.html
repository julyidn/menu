<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061838">
<title>Menu Hari Ini · Larangan Gaga</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --latar:#061838; --panel:#0D2A5A; --emas:#D2B16A; --emas-tua:#A8873F;
  --teks:#EBF0F8; --teks-samar:#8FA2BF;
  --garis:rgba(210,177,106,.22); --garis-lembut:rgba(255,255,255,.09);
  --baja:#E5EAF1; --baja-tua:#C3CCD9; --baja-garis:#AEB9C9; --tinta:#0E1726;
  --awas:#FF7A66; --awas-latar:#2E0E09; --awas-garis:#7C2C22;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--latar);font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color:var(--teks);line-height:1.5}
.wadah{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--latar);
  display:flex;flex-direction:column}

/* ---------- Kop lembaga ---------- */
.kepala{padding:20px 20px 22px;border-bottom:2px solid var(--emas);
  background:linear-gradient(180deg,#0A2350,var(--latar))}
.lembaga{display:flex;gap:13px;align-items:center}
.logo{width:54px;height:54px;flex:none;border-radius:50%;display:block}
.program{font-size:9px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--emas)}
.unit{font-size:14.5px;font-weight:700;line-height:1.28;margin-top:4px;letter-spacing:-.01em;color:#fff}
.yayasan{font-size:11px;font-weight:500;color:var(--teks-samar);margin-top:2px}
.garis{height:1px;background:var(--garis);margin:17px 0 15px}
.hari{font-family:"Baloo 2",cursive;font-size:29px;font-weight:700;line-height:1.15;color:#fff}
.tgl{font-size:13.5px;font-weight:500;color:var(--teks-samar);margin-top:1px}

.isi{padding:22px 18px 30px;flex:1}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--teks-samar);margin-bottom:11px}

/* ---------- Foto ---------- */
.foto{margin-bottom:0;opacity:0;animation:masuk .5s ease forwards}
.foto img{width:100%;height:auto;display:block;border-radius:16px;
  border:1px solid var(--garis-lembut);box-shadow:0 20px 40px -24px rgba(0,0,0,.9)}
.stempel{margin-top:10px;display:flex;align-items:center;gap:9px;
  background:var(--awas-latar);border:1px solid var(--awas-garis);color:var(--awas);
  padding:11px 13px;border-radius:12px;font-size:12.5px;font-weight:700;line-height:1.35}
.stempel svg{flex:none}
@keyframes masuk{to{opacity:1}}

/* ---------- Nampan ---------- */
.nampan {
  background: linear-gradient(160deg, #F2F5F9, var(--baja-tua));
  border: 1px solid var(--baja-garis);
  border-radius: 18px;
  padding: 8px;
  box-shadow: 0 16px 34px -20px rgba(0,0,0,.85);
  display: grid;
  gap: 8px;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr 1fr; /* Membuat tinggi baris 2 & 3 otomatis sama rata */
}

.sekat {
  background: var(--baja);
  border: 1px solid rgba(174,185,201,.9);
  border-radius: 12px;
  padding: 11px 12px;
  box-shadow: inset 0 2px 5px rgba(93,110,135,.16);
  display: flex;
  flex-direction: column;
  justify-content: flex-start; /* Mengunci Tag di bagian atas kotak */
  min-height: 80px;
  opacity: 0;
  transform: scale(.94);
  animation: sajikan .42s cubic-bezier(.22,1,.3,1) forwards;
}

.sekat:nth-child(1) { grid-column: 1/3; grid-row: 1; animation-delay: .05s; }
.sekat:nth-child(2) { grid-column: 1; grid-row: 2; animation-delay: .13s; }
.sekat:nth-child(3) { grid-column: 2; grid-row: 2; animation-delay: .21s; }
.sekat:nth-child(4) { grid-column: 1; grid-row: 3; animation-delay: .29s; }
.sekat:nth-child(5) { grid-column: 2; grid-row: 3; animation-delay: .37s; }

@keyframes sajikan { to { opacity: 1; transform: scale(1); } }

.sekat .tag {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--emas-tua);
  margin-bottom: 4px;
  line-height: 1;
}

.sekat .nama {
  font-family: "Baloo 2", cursive;
  font-weight: 600;
  font-size: 15px;
  line-height: 1.2;
  color: var(--tinta);
  
  /* Mencegah teks terlalu panjang merusak tinggi kotak */
  display: -webkit-box;
  -webkit-line-clamp: 2; /* Maksimal 2 baris agar rapi & tidak meluber */
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.sekat:nth-child(1) .nama {
  font-size: 18px;
  -webkit-line-clamp: 1;
}

.sekat.kosong .nama {
  color: #7C8798;
  font-family: "Plus Jakarta Sans", sans-serif;
  font-size: 14px;
  font-weight: 500;
}

/* ---------- Pelengkap ---------- */
.pelengkap {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--panel);
  border: 1px solid var(--garis-lembut);
  border-radius: 12px;
  padding: 11px 13px;
}

.pelengkap .titik {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emas);
  flex: none;
}

.pelengkap span {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--teks);
}

/* ---------- Gizi ---------- */
.gizi{margin-top:20px;background:var(--panel);border:1px solid var(--garis);
  border-radius:14px;overflow:hidden}
.gizi h2{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--emas);padding:13px 16px 11px}
.gt-baris{display:grid;align-items:center;padding:10px 16px;
  border-top:1px solid var(--garis-lembut)}
.gt-kepala{background:rgba(0,0,0,.28);border-top:0;padding-top:9px;padding-bottom:9px}
.gt-kepala .gt-nilai b{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--emas)}
.gt-kepala .gt-nilai i{display:block;font-style:normal;font-size:8.5px;font-weight:600;
  color:var(--teks-samar);margin-top:2px;letter-spacing:0}
.gt-zat{font-size:13px;font-weight:600;color:var(--teks)}
.gt-zat small{display:block;font-size:10px;color:var(--teks-samar);font-weight:500}
.gt-nilai{text-align:center;font-size:15px;font-weight:700;color:#fff;
  font-variant-numeric:tabular-nums;line-height:1.25}
.gt-utama{background:rgba(210,177,106,.07)}
.gt-utama .gt-nilai{font-size:23px;color:var(--emas);letter-spacing:-.01em}
.gt-nilai.hampa{color:var(--teks-samar);font-weight:500;font-size:14px}

/* ---------- Himbauan ---------- */
.himbauan{margin-top:20px;margin-bottom:24px;background:var(--awas-latar);
  border:1px solid var(--awas-garis);border-radius:16px;padding:16px 16px 15px}
.himbauan h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;
  color:var(--awas);margin-bottom:13px;letter-spacing:-.01em}
.himbauan ul{list-style:none;display:flex;flex-direction:column;gap:12px}
.himbauan li{display:flex;gap:11px;align-items:flex-start}
.himbauan .no{flex:none;width:22px;height:22px;border-radius:7px;
  background:rgba(255,122,102,.16);border:1px solid var(--awas-garis);color:var(--awas);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.himbauan b{display:block;font-size:13.5px;font-weight:700;color:#FFD3CA}
.himbauan p{font-size:12.5px;line-height:1.55;color:#C99C93;margin-top:2px}

/* ---------- Catatan ---------- */
.catatan{margin-top:14px;background:rgba(210,177,106,.08);border:1px solid var(--garis);
  border-radius:12px;padding:12px 14px;font-size:13px;color:#DCCEA9}
.catatan b{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--emas);margin-bottom:4px}

/* ---------- Pilihan hari ---------- */
.minggu{margin-top:26px}
.pita{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pita::-webkit-scrollbar{display:none}
.pita button{flex:none;width:52px;padding:9px 0;border:1px solid var(--garis-lembut);
  background:var(--panel);border-radius:11px;font-family:inherit;cursor:pointer;
  text-align:center;transition:border-color .15s,background .15s}
.pita button:focus-visible{outline:2px solid var(--emas);outline-offset:2px}
.pita button i{display:block;font-style:normal;font-size:9.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--teks-samar)}
.pita button em{display:block;font-style:normal;font-size:16px;font-weight:700;
  color:var(--teks);margin-top:2px;font-variant-numeric:tabular-nums}
.pita button[aria-pressed="true"]{background:var(--emas);border-color:var(--emas)}
.pita button[aria-pressed="true"] i{color:rgba(6,24,56,.65)}
.pita button[aria-pressed="true"] em{color:var(--latar)}
.pita button[disabled]{opacity:.35;cursor:default}

.status{text-align:center;padding:52px 24px}
.status .nama{font-family:"Baloo 2",cursive;font-size:19px;font-weight:600;margin-bottom:6px;color:#fff}
.status p{font-size:13.5px;color:var(--teks-samar)}

.kaki{padding:18px 20px 28px;text-align:center;font-size:11.5px;color:var(--teks-samar);
  border-top:1px solid var(--garis-lembut);line-height:1.75}
.kaki b{color:var(--teks);font-weight:600}

@media (prefers-reduced-motion:reduce){.sekat,.foto{animation:none;opacity:1;transform:none}}

.sekat:nth-child(1){background:#fff6dd;border-color:#f4d98b}.sekat:nth-child(2){background:#fff0ed;border-color:#f4c1b8}.sekat:nth-child(3){background:#eef9ef;border-color:#bfe1c1}.sekat:nth-child(4){background:#edf7ff;border-color:#b8dff4}.sekat:nth-child(5){background:#fff0f5;border-color:#f1c2d0}.sekat .tag{color:#b06b3c;font-size:8px}.sekat .nama{font-size:14px}.sekat:nth-child(1) .nama{font-size:14px}

<body>
<div class="wadah">

function keDate(ymd){ const b=ymd.split('-'); return new Date(Date.UTC(+b[0],+b[1]-1,+b[2],12,0,0)); }
function esc(t){ return String(t==null?'':t).replace(/[<>&"]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }


function ambilIdDrive(url){
  const s = String(url||'');
  let m = s.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = s.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = s.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  return m ? m[1] : '';
}
function normalisasiFoto(nilai){
  if(nilai==null) return '';
  const s = String(nilai).trim();
  if(!s) return '';
  if(/^data:image\//i.test(s) || /^blob:/i.test(s)) return s;
  const driveId = ambilIdDrive(s);
  if(driveId) return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(driveId)+'&sz=w1600';
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-zA-Z0-9_-]{20,}$/.test(s))
    return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(s)+'&sz=w1600';
  return s;
}
function sumberFoto(menu){
  if(!menu || typeof menu!=='object') return '';
  return normalisasiFoto(
    menu.foto || menu.foto_url || menu.fotoUrl ||
    menu.image || menu.image_url || menu.gambar ||
    menu.gambar_url || menu.foto_id || menu.image_id || ''
  );
}

function adaIsi(g){ return !!(g && (g.energi||g.protein||g.lemak||g.karbohidrat||g.serat)); }

function gambarKepala(ymd){
  const d = keDate(ymd);
  el('hari').textContent = HARI[d.getDay()];
  el('tgl').textContent  = d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear();
}

function blokFoto(menu){
  const foto = sumberFoto(menu);
  if(!foto) return '';
  const alt = 'Foto menu ' + [menu.makanan_pokok, menu.lauk_hewani].filter(Boolean).join(', ');
  return '<div class="foto">'
    + '<img src="'+esc(foto)+'" alt="'+esc(alt)+'" loading="eager" '
    + 'onerror="this.closest(\'.foto\').remove()">'
    + '</div>';
}

function blokGizi(menu){
  const g = menu.gizi || {};
  const kolom = ['pk','pb'].filter(function(p){ return adaIsi(g[p]); });
  if(!kolom.length) return '';

  const kisi = 'style="grid-template-columns:1fr' + kolom.map(function(){ return ' 86px'; }).join('') + '"';

  const kepala = '<div class="gt-baris gt-kepala" '+kisi+'><span class="gt-zat"></span>'
    + kolom.map(function(p){
        return '<span class="gt-nilai"><b>'+PORSI[p].nama+'</b></span>';
      }).join('')
    + '</div>';

  const baris = ZAT.map(function(z){
    return '<div class="gt-baris'+(z.utama?' gt-utama':'')+'" '+kisi+'>'
      + '<span class="gt-zat">'+z.label+'<small>'+z.satuan+'</small></span>'
      + kolom.map(function(p){
          const n = g[p][z.kunci];
          return n ? '<span class="gt-nilai">'+esc(n)+'</span>'
                   : '<span class="gt-nilai hampa">–</span>';
        }).join('')
      + '</div>';
  }).join('');

  return '<section class="gizi"><h2>Kandungan gizi per porsi</h2>'+kepala+baris+'</section>';
}

function blokHimbauan(){
  return '<section class="himbauan"><h2>'+IKON_AWAS+'Wajib diperhatikan</h2><ul>'
    + HIMBAUAN.map(function(h,i){
        return '<li><span class="no">'+(i+1)+'</span><div><b>'+esc(h.judul)+'</b>'
          + '<p>'+esc(h.isi)+'</p></div></li>';
      }).join('')
    + '</ul></section>';
}

function gambarMenu(menu){
  const sekat = SEKAT.map(function(s){
    const isi = menu[s.kunci];
    return '<div class="sekat'+(isi?'':' kosong')+'"><div class="tag">'+s.tag+'</div>'
      + '<div class="nama">'+(isi?esc(isi):'—')+'</div></div>';
  }).join('');

  return blokFoto(menu)
    + blokHimbauan()
    + '<div class="eyebrow">Isi ompreng hari ini</div>'
    + '<div class="nampan">'+sekat+'</div>'
    + (menu.pelengkap
        ? '<div class="pelengkap"><span class="titik"></span><span>'+esc(menu.pelengkap)+'</span></div>'
        : '')
    + blokGizi(menu)
    + (menu.catatan
        ? '<div class="catatan"><b>Kandungan alergen</b>'+esc(menu.catatan)+'</div>'
        : '');
}

function gambarMinggu(aktif){
  if(!dataMinggu.length) return '';
  return '<section class="minggu"><div class="eyebrow">Menu minggu ini</div><div class="pita">'
    + dataMinggu.map(function(m){
        const d = keDate(m.tanggal);
        return '<button type="button" data-tgl="'+m.tanggal+'" aria-pressed="'
          + (m.tanggal===aktif) + '"' + (m.makanan_pokok?'':' disabled') + '>'
          + '<i>'+SINGK[d.getDay()]+'</i><em>'+d.getDate()+'</em></button>';
      }).join('')
    + '</div></section>';
}

function tampilkan(ymd){
  menuAktif = dataMinggu.filter(function(m){ return m.tanggal===ymd; })[0] || null;
  gambarKepala(ymd);

  el('isi').innerHTML = (menuAktif && menuAktif.makanan_pokok)
    ? gambarMenu(menuAktif) + gambarMinggu(ymd)
    : '<div class="status"><div class="nama">Menu belum tersedia</div>'
      + '<p>Menu untuk tanggal ini belum diinput oleh dapur.</p></div>' + gambarMinggu(ymd);

  Array.prototype.forEach.call(
    el('isi').querySelectorAll('.pita button[data-tgl]'),
    function(b){ b.addEventListener('click', function(){
      tampilkan(b.dataset.tgl); window.scrollTo({top:0,behavior:'smooth'}); }); }
  );
}

function gagal(pesan){
  el('hari').textContent = 'Menu hari ini';
  el('tgl').textContent  = '';
  el('isi').innerHTML = '<div class="status"><div class="nama">Tidak bisa memuat menu</div>'
    + '<p>'+(pesan||'Periksa koneksi internet, lalu muat ulang halaman.')+'</p></div>';
}

function apiSiap(){
  return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(API)
      && API.indexOf('GANTI_DENGAN') === -1;
}

(function(){
  if(!apiSiap()){
    gagal('Konstanta API di index.html belum diisi dengan URL Web App Apps Script.');
    return;
  }

  /*
   * PENTING:
   * Halaman publik TIDAK boleh memakai data menu dari tanggal lama
   * sebagai pengganti tanggal hari ini. Sebelumnya, ketika fetch gagal,
   * kode membaca localStorage lalu menjalankan tampilkan(c.hariIni).
   * Akibatnya menu tanggal sebelumnya bisa terlihat seolah-olah menu hari ini.
   *
   * Sekarang:
   * 1. Ambil data langsung dari API untuk tanggal hari ini.
   * 2. Tambahkan cache-buster agar browser tidak menyajikan response lama.
   * 3. Validasi tanggal dan tampilkan HANYA record yang tanggalnya sama
   *    dengan hari ini.
   * 4. Jika API gagal / kosong, tampilkan "Menu belum tersedia".
   * 5. Tidak ada fallback ke localStorage atau tanggal sebelumnya.
   */
  const hariIni = tanggalHariIni();
  const url = API + '?tanggal=' + encodeURIComponent(hariIni)
                    + '&segar=1&_ts=' + Date.now();

  fetch(url, {
    method: 'GET',
    cache: 'no-store'
  })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data){
      if(!data || !data.ok) throw new Error('Respons API tidak valid.');

      const semua = Array.isArray(data.minggu) ? data.minggu : [];

      // Normalisasi tanggal agar perbandingan konsisten.
      dataMinggu = semua.filter(function(m){
        return m && typeof m === 'object' && /^\d{4}-\d{2}-\d{2}$/.test(String(m.tanggal || ''));
      }).map(function(m){
        const foto = sumberFoto(m);
        if(foto) m.foto = foto;
        return m;
      });

      // Pastikan record aktif selalu dicari berdasarkan tanggal HARI INI.
      // Jika API hanya mengirim data tanggal lain, hasilnya tetap kosong.
      const adaMenuHariIni = dataMinggu.some(function(m){
        return String(m.tanggal) === hariIni && !!m.makanan_pokok;
      });

      tampilkan(hariIni);

      // Jika API mengembalikan minggu tetapi hari ini belum diinput,
      // halaman tetap boleh menampilkan navigasi hari lain yang memang
      // memiliki menu, namun TIDAK pernah mengganti hari aktif ke tanggal lama.
      if(!adaMenuHariIni){
        menuAktif = null;
      }
    })
    .catch(function(){
      // Jangan mengambil localStorage/cache tanggal lama.
      // Jika server tidak bisa diakses, keadaan paling aman adalah
      // menyatakan menu hari ini belum tersedia.
      dataMinggu = [];
      menuAktif = null;
      tampilkan(hariIni);
    });
})();
</script>
