<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061838">
<meta name="robots" content="noindex">
<title>Kelola Menu · SPPG Larangan Gaga</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --latar:#061838; --panel:#0D2A5A; --panel-2:#0A2350; --emas:#D2B16A;
  --teks:#EBF0F8; --teks-samar:#8FA2BF;
  --garis:rgba(210,177,106,.22); --garis-lembut:rgba(255,255,255,.1);
  --isian:#0A2350; --hijau:#4ADE9B; --awas:#FF7A66; --awas-garis:#7C2C22;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--latar);font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  color:var(--teks);line-height:1.5}
.wadah{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- Tampil / sembunyi ---------- */
[hidden]{display:none !important}
#app{flex:1;flex-direction:column}
#app:not([hidden]){display:flex}

/* ---------- Gerbang PIN ---------- */
.gerbang{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;gap:5px}
.gerbang img{width:72px;height:72px;border-radius:50%;margin-bottom:18px}
.gerbang h1{font-size:19px;font-weight:700;color:#fff}
.gerbang p{font-size:13px;color:var(--teks-samar);margin-bottom:22px}
.gerbang input{width:190px;text-align:center;font-family:inherit;font-size:26px;font-weight:700;
  letter-spacing:.35em;padding:14px 10px 14px 22px;border-radius:13px;
  background:var(--isian);border:1px solid var(--garis-lembut);color:#fff}
.gerbang input:focus{outline:2px solid var(--emas);outline-offset:1px}
.gerbang button{margin-top:14px;width:190px;padding:13px;border:0;border-radius:12px;
  background:var(--emas);color:var(--latar);font-family:inherit;font-size:14px;
  font-weight:700;cursor:pointer}
.gerbang .galat{color:var(--awas);font-size:12.5px;min-height:19px;margin-top:12px;font-weight:600}

/* ---------- Kop ---------- */
.kepala{padding:16px 18px;border-bottom:2px solid var(--emas);
  background:linear-gradient(180deg,var(--panel-2),var(--latar));
  display:flex;gap:12px;align-items:center}
.kepala img{width:44px;height:44px;border-radius:50%;flex:none}
.kepala .judul{font-size:14px;font-weight:700;color:#fff;line-height:1.25}
.kepala .sub{font-size:10.5px;color:var(--teks-samar);margin-top:2px}
.keluar{margin-left:auto;background:transparent;border:1px solid var(--garis-lembut);
  color:var(--teks-samar);border-radius:9px;padding:7px 11px;font-family:inherit;
  font-size:11.5px;font-weight:600;cursor:pointer}

/* ---------- Navigasi minggu ---------- */
.alat{padding:14px 18px 4px;position:sticky;top:0;z-index:5;
  background:var(--latar);border-bottom:1px solid var(--garis-lembut)}
.nav-minggu{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.nav-minggu span{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--teks-samar)}
.nav-minggu button{width:34px;height:34px;border-radius:10px;border:1px solid var(--garis-lembut);
  background:var(--panel);color:var(--teks);font-size:16px;cursor:pointer;line-height:1}
.hari-pita{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.hari-pita::-webkit-scrollbar{display:none}
.hari-pita button{flex:1;min-width:52px;padding:8px 0 9px;border:1px solid var(--garis-lembut);
  background:var(--panel);border-radius:11px;font-family:inherit;cursor:pointer;
  text-align:center;position:relative}
.hari-pita button i{display:block;font-style:normal;font-size:9px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--teks-samar)}
.hari-pita button em{display:block;font-style:normal;font-size:15px;font-weight:700;
  color:var(--teks);margin-top:1px;font-variant-numeric:tabular-nums}
.hari-pita button .isi-titik{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--hijau)}
.hari-pita button[aria-pressed="true"]{background:var(--emas);border-color:var(--emas)}
.hari-pita button[aria-pressed="true"] i{color:rgba(6,24,56,.6)}
.hari-pita button[aria-pressed="true"] em{color:var(--latar)}
.hari-pita button[aria-pressed="true"] .isi-titik{background:rgba(6,24,56,.55)}

/* ---------- Isi ---------- */
main{flex:1;padding:20px 18px 108px}
section{margin-bottom:24px}
h2{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--emas);margin-bottom:11px}
label{display:block;font-size:11.5px;font-weight:600;color:var(--teks-samar);margin-bottom:5px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:14px;font-weight:500;
  padding:11px 13px;border-radius:11px;background:var(--isian);
  border:1px solid var(--garis-lembut);color:var(--teks)}
input[type=text]:focus,textarea:focus,select:focus,input[type=number]:focus{
  outline:2px solid var(--emas);outline-offset:1px}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.ladang{margin-bottom:13px}

/* ---------- Foto ---------- */
.foto-kotak{border:1px dashed var(--garis);border-radius:15px;padding:16px;text-align:center;
  background:rgba(255,255,255,.02)}
.foto-kotak p{font-size:12.5px;color:var(--teks-samar);margin-bottom:12px;line-height:1.5}
.foto-pratinjau{width:100%;border-radius:12px;display:block;margin-bottom:12px;
  border:1px solid var(--garis-lembut)}
.tombol-garis{display:inline-block;padding:10px 16px;border-radius:11px;
  border:1px solid var(--emas);background:transparent;color:var(--emas);
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tombol-lembut{padding:10px 16px;border-radius:11px;border:1px solid var(--garis-lembut);
  background:transparent;color:var(--teks-samar);font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer}
.foto-aksi{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- Tabel gizi ---------- */
.gizi-tabel{background:var(--panel);border:1px solid var(--garis);border-radius:14px;
  overflow:hidden}
.gizi-baris{display:grid;grid-template-columns:1fr 82px 82px;gap:8px;
  align-items:center;padding:9px 13px;border-top:1px solid var(--garis-lembut)}
.gizi-baris:first-child{border-top:0}
.gizi-kepala{background:rgba(0,0,0,.25);padding:11px 13px}
.gizi-kepala b{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--emas);text-align:center;display:block}
.gizi-kepala b:first-child{text-align:left;color:var(--teks-samar)}
.gizi-kepala .ket{display:block;font-size:8.5px;font-weight:600;letter-spacing:0;
  text-transform:none;color:var(--teks-samar);margin-top:2px}
.gizi-baris .zat{font-size:13px;font-weight:600;color:var(--teks)}
.gizi-baris .zat small{display:block;font-size:10px;color:var(--teks-samar);font-weight:500}
.gizi-baris input{width:100%;text-align:center;font-family:inherit;font-size:14px;
  font-weight:700;padding:9px 4px;border-radius:9px;background:var(--isian);
  border:1px solid var(--garis-lembut);color:#fff;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.gizi-baris input::-webkit-outer-spin-button,
.gizi-baris input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- Salin ---------- */
.salin{display:flex;gap:8px}
.salin select{flex:1}

/* ---------- Bahaya ---------- */
.bahaya{border:1px solid var(--awas-garis);border-radius:13px;padding:14px;
  background:rgba(255,122,102,.05)}
.bahaya p{font-size:12px;color:var(--teks-samar);margin-bottom:11px;line-height:1.5}
.bahaya button{padding:10px 16px;border-radius:11px;border:1px solid var(--awas-garis);
  background:transparent;color:var(--awas);font-family:inherit;font-size:13px;
  font-weight:700;cursor:pointer}

/* ---------- Bilah simpan ---------- */
.bilah{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:linear-gradient(180deg,rgba(6,24,56,0),var(--latar) 26%);
  padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.bilah-dalam{max-width:560px;margin:0 auto}
.simpan{width:100%;padding:15px;border:0;border-radius:13px;background:var(--emas);
  color:var(--latar);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
.simpan:disabled{opacity:.55;cursor:default}

/* ---------- Pesan singkat ---------- */
.pesan{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);
  background:#0A2350;border:1px solid var(--garis);color:var(--teks);
  padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.9);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:20;max-width:88vw;text-align:center}
.pesan.tampil{opacity:1;transform:translateX(-50%) translateY(0)}
.pesan.salah{border-color:var(--awas-garis);color:#FFD3CA}
.pesan.benar{border-color:rgba(74,222,155,.4);color:#BDF3D8}

.memuat{text-align:center;padding:44px 20px;color:var(--teks-samar);font-size:13.5px}

/* ===== FRESH PLAYFUL ADMIN THEME ===== */

.gerbang,.kepala,.alat,main{position:relative}
.gerbang{background:rgba(255,255,255,.82)!important;border:2px solid #efddc7!important;border-radius:26px!important;box-shadow:0 18px 45px rgba(120,80,40,.12)!important}
header.kepala{background:linear-gradient(135deg,#ff9a5a,#ff7b66 58%,#ff8fab)!important;border:0!important;border-radius:0 0 28px 28px!important;box-shadow:0 15px 32px rgba(225,111,65,.18)!important;color:#fff}

#borang{background:transparent!important}.kart, .kartu, .panel, .form-kartu{background:#fff!important;border:2px solid #ecdcc9!important;border-radius:20px!important;box-shadow:0 9px 20px rgba(120,80,40,.07)!important}
input,select,textarea{background:#fffaf4!important;border:2px solid #eadbca!important;border-radius:12px!important;color:#2f3d42!important}input:focus,select:focus,textarea:focus{border-color:#ffab78!important;box-shadow:0 0 0 4px rgba(255,138,76,.12)!important;outline:none!important}

<div class="pesan" id="pesan"></div>

<script>
/* ============================================================
   PENGATURAN — samakan dengan API di index.html
   ============================================================ */
const API  = 'https://script.google.com/macros/s/AKfycbwto-3D8Pn5lH1l5zjC7wqMyh6BfD_TPwfc1DLvKo6G7ynPy9vOAWYj0s5JYP3nWjnB/exec';
const ZONA = 'Asia/Jakarta';
const MAX_LEBAR = 1400;    // piksel, foto dikecilkan sebelum dikirim
const MUTU_FOTO = 0.75;
/* ============================================================ */

const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const SINGK = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

const SEKAT = [
  { kunci:'makanan_pokok', label:'Makanan pokok', contoh:'Nasi Putih' },
  { kunci:'lauk_hewani',   label:'Lauk hewani',   contoh:'Ayam Bumbu Kuning' },
  { kunci:'lauk_nabati',   label:'Lauk nabati',   contoh:'Tempe Bacem' },
  { kunci:'sayur',         label:'Sayur',         contoh:'Tumis Buncis Wortel' },
  { kunci:'buah',          label:'Buah',          contoh:'Pisang Ambon' },
  { kunci:'pelengkap',     label:'Pelengkap (boleh kosong)', contoh:'Susu UHT 125 ml' }
];
const ZAT = [
  { kunci:'energi',      label:'Energi',      satuan:'kkal' },
  { kunci:'protein',     label:'Protein',     satuan:'gram' },
  { kunci:'lemak',       label:'Lemak',       satuan:'gram' },
  { kunci:'karbohidrat', label:'Karbohidrat', satuan:'gram' },
  { kunci:'serat',       label:'Serat',       satuan:'gram' }
];

let PIN = '';
let minggu = [];
let seninAktif = '';
let tglAktif = '';
let fotoBaru = null;      // dataURL kalau pengguna memilih foto baru
let fotoDihapus = false;

const el = (id) => document.getElementById(id);

function hariIni(){
  return new Intl.DateTimeFormat('en-CA',
    {timeZone:ZONA,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
function keDate(y){ const b=y.split('-'); return new Date(+b[0],+b[1]-1,+b[2]); }
function keYmd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
    +'-'+String(d.getDate()).padStart(2,'0');
}
function awalMinggu(ymd){
  const d = keDate(ymd);
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return keYmd(d);
}
function geserMinggu(senin, n){
  const d = keDate(senin); d.setDate(d.getDate()+n*7); return keYmd(d);
}
function esc(t){ return String(t==null?'':t).replace(/[<>&"]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }



function ambilIdDrive(url){
  const s = String(url||'');
  let m = s.match(/\/file\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = s.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = s.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  return m ? m[1] : '';
}
function normalisasiFoto(nilai){
  if(nilai==null) return '';
  const s = String(nilai).trim();
  if(!s) return '';
  if(/^data:image\//i.test(s) || /^blob:/i.test(s)) return s;
  const driveId = ambilIdDrive(s);
  if(driveId) return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(driveId)+'&sz=w1600';
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-zA-Z0-9_-]{20,}$/.test(s))
    return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(s)+'&sz=w1600';
  return s;
}
function sumberFoto(menu){
  if(!menu || typeof menu!=='object') return '';
  return normalisasiFoto(
    menu.foto || menu.foto_url || menu.fotoUrl ||
    menu.image || menu.image_url || menu.gambar ||
    menu.gambar_url || menu.foto_id || menu.image_id || ''
  );
}

function pesan(teks, jenis){
  const p = el('pesan');
  p.textContent = teks;
  p.className = 'pesan tampil ' + (jenis||'');
  clearTimeout(p._t);
  p._t = setTimeout(function(){ p.className = 'pesan ' + (jenis||''); }, 2600);
}

/* ============================================================
   MASUK
   ============================================================ */
el('masuk').addEventListener('click', cobaMasuk);
el('pin').addEventListener('keydown', function(e){ if(e.key==='Enter') cobaMasuk(); });

function cobaMasuk(){
  const nilai = el('pin').value.trim();
  if(!nilai){ el('galatPin').textContent = 'Masukkan PIN dulu.'; return; }

  el('masuk').disabled = true;
  el('galatPin').textContent = 'Memeriksa…';

  kirim({ aksi:'masuk', pin:nilai })
    .then(function(r){
      if(r.ok){
        PIN = nilai;
        try{ sessionStorage.setItem('pin-sppg', PIN); }catch(e){}
        bukaApp();
      } else {
        el('galatPin').textContent = r.pesan || 'PIN salah.';
      }
    })
    .catch(function(){ el('galatPin').textContent = 'Tidak bisa menghubungi server.'; })
    .finally(function(){ el('masuk').disabled = false; });
}

function bukaApp(){
  el('gerbang').hidden = true;
  el('app').hidden = false;
  const kini = hariIni();
  seninAktif = awalMinggu(kini);
  tglAktif   = kini;
  muatMinggu();
}

el('keluar').addEventListener('click', function(){
  try{ sessionStorage.removeItem('pin-sppg'); }catch(e){}
  location.reload();
});

/* ============================================================
   KOMUNIKASI
   ============================================================ */
function apiSiap(){
  return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(API)
      && API.indexOf('GANTI_DENGAN') === -1;
}

function kirim(muatan){
  return fetch(API, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },   // hindari preflight CORS
    body: JSON.stringify(muatan)
  }).then(function(r){ return r.json(); });
}

function muatMinggu(){
  el('borang').innerHTML = '<div class="memuat">Memuat data…</div>';
  fetch(API + '?tanggal=' + seninAktif + '&segar=1')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok) throw new Error(d.pesan);
      minggu = Array.isArray(d.minggu) ? d.minggu.map(function(m){
        if(m && typeof m === 'object'){
          const foto = sumberFoto(m);
          if(foto) m.foto = foto;
        }
        return m;
      }) : [];
      if(minggu.length && !minggu.some(function(m){ return m && m.tanggal===tglAktif; })) tglAktif = minggu[0].tanggal;
      gambarNav();
      gambarBorang();
    })
    .catch(function(){
      el('borang').innerHTML = '<div class="memuat">Gagal memuat. Periksa koneksi lalu muat ulang.</div>';
    });
}

el('mundur').addEventListener('click', function(){
  seninAktif = geserMinggu(seninAktif,-1); tglAktif = seninAktif; muatMinggu();
});
el('maju').addEventListener('click', function(){
  seninAktif = geserMinggu(seninAktif, 1); tglAktif = seninAktif; muatMinggu();
});

/* ============================================================
   NAVIGASI HARI
   ============================================================ */
function gambarNav(){
  const a = keDate(minggu[0].tanggal), b = keDate(minggu[minggu.length-1].tanggal);
  el('labelMinggu').textContent =
    a.getDate()+' '+BULAN[a.getMonth()]+' – '+b.getDate()+' '+BULAN[b.getMonth()]+' '+b.getFullYear();

  el('pitaHari').innerHTML = minggu.map(function(m){
    const d = keDate(m.tanggal);
    return '<button type="button" data-tgl="'+m.tanggal+'" aria-pressed="'+(m.tanggal===tglAktif)+'">'
      + '<i>'+SINGK[d.getDay()]+'</i><em>'+d.getDate()+'</em>'
      + (m.makanan_pokok ? '<span class="isi-titik"></span>' : '') + '</button>';
  }).join('');

  Array.prototype.forEach.call(el('pitaHari').querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){
      tglAktif = b.dataset.tgl;
      fotoBaru = null; fotoDihapus = false;
      gambarNav(); gambarBorang();
    });
  });
}

function menuAktif(){
  return minggu.filter(function(m){ return m.tanggal===tglAktif; })[0] || { tanggal: tglAktif };
}

/* ============================================================
   BORANG
   ============================================================ */
function gambarBorang(){
  const m = menuAktif();
  const g = m.gizi || { pk:{}, pb:{} };
  const d = keDate(tglAktif);

  const ladang = SEKAT.map(function(s){
    return '<div class="ladang"><label for="f_'+s.kunci+'">'+s.label+'</label>'
      + '<input type="text" id="f_'+s.kunci+'" value="'+esc(m[s.kunci]||'')+'" '
      + 'placeholder="'+s.contoh+'" autocomplete="off"></div>';
  }).join('');

  const barisGizi = ZAT.map(function(z){
    return '<div class="gizi-baris">'
      + '<div class="zat">'+z.label+'<small>'+z.satuan+'</small></div>'
      + '<input type="number" inputmode="decimal" step="any" min="0" id="g_pk_'+z.kunci+'" '
      + 'value="'+esc((g.pk||{})[z.kunci]||'')+'">'
      + '<input type="number" inputmode="decimal" step="any" min="0" id="g_pb_'+z.kunci+'" '
      + 'value="'+esc((g.pb||{})[z.kunci]||'')+'">'
      + '</div>';
  }).join('');

  const lain = minggu.filter(function(x){ return x.tanggal!==tglAktif && x.makanan_pokok; });

  el('borang').innerHTML =
    '<section><h2>'+HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()+'</h2>'
      + (lain.length
          ? '<div class="salin"><select id="salinDari">'
            + '<option value="">Salin isian dari hari lain…</option>'
            + lain.map(function(x){
                const y = keDate(x.tanggal);
                return '<option value="'+x.tanggal+'">'+SINGK[y.getDay()]+' '+y.getDate()+' '
                  + BULAN[y.getMonth()]+' — '+esc(x.lauk_hewani||x.makanan_pokok)+'</option>';
              }).join('')
            + '</select><button class="tombol-lembut" id="tombolSalin">Salin</button></div>'
          : '')
    + '</section>'

    + '<section><h2>Foto menu</h2><div class="foto-kotak" id="kotakFoto"></div></section>'

    + '<section><h2>Isi ompreng</h2>'+ladang+'</section>'

    + '<section><h2>Nilai gizi per porsi</h2>'
      + '<div class="gizi-tabel">'
        + '<div class="gizi-baris gizi-kepala"><b>Zat gizi</b>'
          + '<b>Kecil</b>'
          + '<b>Besar</b></div>'
        + barisGizi
      + '</div></section>'

    + '<section><h2>Catatan alergen</h2>'
      + '<textarea id="f_catatan" placeholder="Contoh: Mengandung telur dan kacang kedelai.">'
      + esc(m.catatan||'') + '</textarea></section>'

    + (m.makanan_pokok
        ? '<section><h2>Hapus</h2><div class="bahaya">'
          + '<p>Menghapus akan mengosongkan menu tanggal ini dari halaman publik.</p>'
          + '<button id="tombolHapus">Hapus menu tanggal ini</button></div></section>'
        : '');

  gambarFoto();

  const salin = el('tombolSalin');
  if(salin) salin.addEventListener('click', salinDariHari);

  const hapus = el('tombolHapus');
  if(hapus) hapus.addEventListener('click', hapusMenu);
}

/* ---------- Foto ---------- */
function gambarFoto(){
  const m = menuAktif();
  const fotoTersimpan = fotoDihapus ? '' : sumberFoto(m);
  const tampil = fotoBaru || fotoTersimpan;

  el('kotakFoto').innerHTML = tampil
    ? '<img class="foto-pratinjau" src="'+esc(tampil)+'" alt="Pratinjau foto menu" loading="eager" onerror="this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<p>Foto tersimpan tetapi alamat gambarnya tidak dapat dimuat.</p>\');">'
      + '<div class="foto-aksi">'
      + '<button class="tombol-garis" id="gantiFoto">Ganti foto</button>'
      + '<button class="tombol-lembut" id="buangFoto">Hapus foto</button></div>'
    : '<p>Foto ompreng hari ini. Potret satu nampan contoh dari atas, cahaya dari samping.</p>'
      + '<button class="tombol-garis" id="gantiFoto">Pilih foto</button>';

  const ganti = el('gantiFoto');
  if(ganti) ganti.addEventListener('click', pilihFoto);

  const buang = el('buangFoto');
  if(buang) buang.addEventListener('click', function(){
    fotoBaru = null; fotoDihapus = true; gambarFoto();
  });
}

function pilihFoto(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.addEventListener('change', function(){
    const berkas = input.files && input.files[0];
    if(!berkas) return;
    pesan('Mengecilkan foto…');
    kecilkan(berkas)
      .then(function(dataUrl){
        fotoBaru = dataUrl; fotoDihapus = false;
        gambarFoto();
        pesan('Foto siap. Jangan lupa simpan.', 'benar');
      })
      .catch(function(){ pesan('Foto tidak bisa dibaca.', 'salah'); });
  });
  input.click();
}

function kecilkan(berkas){
  return new Promise(function(res, rej){
    const gbr = new Image();
    const url = URL.createObjectURL(berkas);
    gbr.onload = function(){
      const skala = Math.min(1, MAX_LEBAR / gbr.width);
      const c = document.createElement('canvas');
      c.width  = Math.round(gbr.width  * skala);
      c.height = Math.round(gbr.height * skala);
      c.getContext('2d').drawImage(gbr, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', MUTU_FOTO));
    };
    gbr.onerror = function(){ URL.revokeObjectURL(url); rej(); };
    gbr.src = url;
  });
}

/* ---------- Salin ---------- */
function salinDariHari(){
  const tgl = el('salinDari').value;
  if(!tgl){ pesan('Pilih tanggalnya dulu.', 'salah'); return; }
  const sumber = minggu.filter(function(x){ return x.tanggal===tgl; })[0];
  if(!sumber) return;

  SEKAT.forEach(function(s){ el('f_'+s.kunci).value = sumber[s.kunci] || ''; });
  const g = sumber.gizi || { pk:{}, pb:{} };
  ZAT.forEach(function(z){
    el('g_pk_'+z.kunci).value = (g.pk||{})[z.kunci] || '';
    el('g_pb_'+z.kunci).value = (g.pb||{})[z.kunci] || '';
  });
  el('f_catatan').value = sumber.catatan || '';
  pesan('Isian disalin. Foto tidak ikut.', 'benar');
}

/* ============================================================
   SIMPAN & HAPUS
   ============================================================ */
el('tombolSimpan').addEventListener('click', simpan);

function simpan(){
  const m = menuAktif();
  const data = { tanggal: tglAktif };

  SEKAT.forEach(function(s){ data[s.kunci] = el('f_'+s.kunci).value.trim(); });
  ZAT.forEach(function(z){
    data['pk_'+z.kunci] = el('g_pk_'+z.kunci).value.trim();
    data['pb_'+z.kunci] = el('g_pb_'+z.kunci).value.trim();
  });
  data.catatan = el('f_catatan').value.trim();

  if(!data.makanan_pokok){
    pesan('Makanan pokok belum diisi.', 'salah');
    el('f_makanan_pokok').focus();
    return;
  }

  data.fotoLama  = m.foto_id || m.fotoId || ambilIdDrive(m.foto||m.foto_url||'') || '';
  data.fotoBaru  = fotoBaru || '';
  data.hapusFoto = fotoDihapus && !fotoBaru;

  const tombol = el('tombolSimpan');
  tombol.disabled = true;
  tombol.textContent = fotoBaru ? 'Mengunggah foto…' : 'Menyimpan…';

  kirim({ aksi:'simpan', pin:PIN, data:data })
    .then(function(r){
      if(!r.ok) throw new Error(r.pesan);
      fotoBaru = null; fotoDihapus = false;
      pesan('Menu tersimpan.', 'benar');
      muatMinggu();
    })
    .catch(function(e){ pesan('Gagal menyimpan. ' + (e.message||''), 'salah'); })
    .finally(function(){
      tombol.disabled = false;
      tombol.textContent = 'Simpan menu';
    });
}

function hapusMenu(){
  if(!confirm('Hapus menu tanggal ini? Halaman publik akan kosong untuk tanggal tersebut.')) return;
  kirim({ aksi:'hapus', pin:PIN, tanggal:tglAktif })
    .then(function(r){
      if(!r.ok) throw new Error(r.pesan);
      fotoBaru = null; fotoDihapus = false;
      pesan('Menu dihapus.', 'benar');
      muatMinggu();
    })
    .catch(function(){ pesan('Gagal menghapus.', 'salah'); });
}

/* ---------- Masuk otomatis dalam sesi yang sama ---------- */
(function(){
  if(!apiSiap()){
    el('gerbang').hidden = false;
    el('galatPin').textContent = 'Konstanta API di kelola.html belum diisi.';
    el('pin').disabled = true;
    el('masuk').disabled = true;
    return;
  }
  let tersimpan = null;
  try{ tersimpan = sessionStorage.getItem('pin-sppg'); }catch(e){}
  if(tersimpan){ PIN = tersimpan; bukaApp(); }
  else { el('gerbang').hidden = false; el('pin').focus(); }
})();
</script>
